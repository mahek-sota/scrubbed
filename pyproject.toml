[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deid"
version = "0.1.0"
description = "Local-only benchmark of regex, Presidio, and a local LLM for de-identifying synthetic clinical notes."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faker>=24",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7,<4",
    "requests>=2.31",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/deid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Line length is enforced by `ruff format`; long string literals and prompts are left as-is.
ignore = ["E501"]
